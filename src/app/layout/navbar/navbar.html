<mat-toolbar color="primary" class="navbar">
  <button mat-icon-button aria-label="Toggle navigation" (click)="menuToggle.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="brand">
    <mat-icon class="brand-icon">storefront</mat-icon>
    <span class="brand-text">Admin Portal</span>
  </span>

  <span class="spacer"></span>

  <button mat-icon-button aria-label="Notifications" matBadge="3" matBadgeColor="warn">
    <mat-icon>notifications</mat-icon>
  </button>

  <button mat-button class="account-btn" [matMenuTriggerFor]="account" aria-label="Account menu">
    <mat-icon>account_circle</mat-icon>
    <span class="account-name">Account</span>
    <mat-icon class="caret">arrow_drop_down</mat-icon>
  </button>

  <mat-menu #account="matMenu">
    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="logout.emit()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
